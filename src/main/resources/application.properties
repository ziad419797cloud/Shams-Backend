# ==================== APP ====================
spring.application.name=educore

# ==================== LOGGING ====================
logging.level.com.educore.security=DEBUG
logging.level.org.springframework.security=DEBUG

# ==================== SESSION ====================
app.session.timeout=30
app.max.sessions.per.user=3
app.auto-logout.enabled=true
app.support.whatsapp=+201234567890

server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

# ==================== DATABASE (RAILWAY FIX) ====================
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==================== FILE UPLOAD ====================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

file.upload.max-size=5242880

file.upload.allowed-types.profiles[0]=image/jpeg
file.upload.allowed-types.profiles[1]=image/jpg
file.upload.allowed-types.profiles[2]=image/png

file.upload.allowed-types.certificates[0]=image/jpeg
file.upload.allowed-types.certificates[1]=image/jpg
file.upload.allowed-types.certificates[2]=image/png
file.upload.allowed-types.certificates[3]=application/pdf

file.upload.allowed-types.documents[0]=application/pdf
file.upload.allowed-types.documents[1]=application/msword

file.upload.folders.profiles=student-profiles
file.upload.folders.certificates=student-certificates
file.upload.folders.documents=student-documents
file.upload.folders.images=general-images

# ==================== CLOUDINARY ====================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dexaocyhu}
cloudinary.api-key=${CLOUDINARY_API_KEY:729244817595141}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:ilK5mdjQaqWLwEJY11HEiVfGNCc}

cloudinary.folder.profiles=${file.upload.folders.profiles}
cloudinary.folder.certificates=${file.upload.folders.certificates}
cloudinary.folder.documents=${file.upload.folders.documents}
